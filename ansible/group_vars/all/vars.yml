travelmemory_repo: https://github.com/UnpredictablePrashant/TravelMemory.git
travelmemory_branch: main
travelmemory_app_root: /opt/travelmemory
travelmemory_upload_dir: /var/lib/travelmemory/uploads
travelmemory_service_name: travelmemory-api
travelmemory_api_port: 3001
travelmemory_database_name: travelmemory

mongodb_major_version: "8.0"
mongodb_admin_user: "{{ vault_mongodb_admin_user }}"
mongodb_admin_password: "{{ vault_mongodb_admin_password }}"
mongodb_app_user: "{{ vault_mongodb_app_user }}"
mongodb_app_password: "{{ vault_mongodb_app_password }}"
mongodb_repo_file: /etc/yum.repos.d/mongodb-org-8.0.repo
mongodb_config_file: /etc/mongod.conf
mongodb_users_script: /var/tmp/travelmemory-ensure-mongodb-users.js
mongodb_user_fingerprint_file: /var/lib/travelmemory/mongodb-app-user.sha256

mongodb_app_password_fingerprint: "{{ vault_mongodb_app_password | hash('sha256') }}"
