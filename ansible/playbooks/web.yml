---
- name: Deploy the TravelMemory web and API services
  hosts: web
  become: true
  gather_facts: true

  pre_tasks:
    - name: Require encrypted MongoDB credentials
      ansible.builtin.assert:
        that:
          - vault_mongodb_app_password | length >= 24
          - "'REPLACE_' not in vault_mongodb_app_password"
        fail_msg: Create and encrypt ansible/group_vars/all/vault.yml with a unique application password of at least 24 characters.
      no_log: true

  tasks:
    - name: Install web-server and Node.js packages
      ansible.builtin.dnf:
        name:
          - git
          - nginx
          - nodejs22
          - nodejs22-npm
        state: present
        update_cache: true

    - name: Remove the distribution welcome site to avoid a default-server conflict
      ansible.builtin.file:
        path: /etc/nginx/conf.d/default.conf
        state: absent
      notify: Reload nginx

    - name: Check for a web-server swap file
      ansible.builtin.stat:
        path: /swapfile
      register: travelmemory_swap

    - name: Create 2 GiB swap space for the React production build
      ansible.builtin.command:
        argv:
          - fallocate
          - -l
          - 2G
          - /swapfile
      when: not travelmemory_swap.stat.exists

    - name: Secure the swap file
      ansible.builtin.file:
        path: /swapfile
        owner: root
        group: root
        mode: "0600"
      when: not travelmemory_swap.stat.exists

    - name: Format the swap file
      ansible.builtin.command:
        argv:
          - mkswap
          - /swapfile
      when: not travelmemory_swap.stat.exists

    - name: Enable swap for this boot
      ansible.builtin.command:
        argv:
          - swapon
          - /swapfile
      when: not travelmemory_swap.stat.exists

    - name: Enable swap after reboot
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: /swapfile swap swap defaults 0 0
        state: present

    - name: Ensure application and upload directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ travelmemory_app_root }}", mode: "0755" }
        - { path: "{{ travelmemory_upload_dir }}", mode: "0750" }

    - name: Check out the TravelMemory application
      ansible.builtin.git:
        repo: "{{ travelmemory_repo }}"
        dest: "{{ travelmemory_app_root }}"
        version: "{{ travelmemory_branch }}"
        force: true
      become_user: ec2-user
      register: travelmemory_checkout

    - name: Check whether the frontend has been built
      ansible.builtin.stat:
        path: /usr/share/nginx/html/index.html
      register: travelmemory_frontend_build

    - name: Check the API endpoint used for the previous frontend build
      ansible.builtin.slurp:
        src: /var/lib/travelmemory/frontend-api-url
      register: travelmemory_previous_frontend_api_url
      failed_when: false

    - name: Decide whether the frontend must be rebuilt
      ansible.builtin.set_fact:
        travelmemory_frontend_needs_build: >-
          {{ travelmemory_checkout.changed or not travelmemory_frontend_build.stat.exists or
             ((travelmemory_previous_frontend_api_url.content | default('') | b64decode | trim) !=
             ('http://' ~ travelmemory_public_dns ~ ':' ~ (travelmemory_api_port | string))) }}

    - name: Install backend production dependencies
      ansible.builtin.command:
        argv:
          - npm
          - install
          - --omit=dev
          - --no-audit
          - --no-fund
      args:
        chdir: "{{ travelmemory_app_root }}/backend"
      become_user: ec2-user
      when: travelmemory_frontend_needs_build | bool

    - name: Install frontend dependencies
      ansible.builtin.command:
        argv:
          - npm
          - install
          - --no-audit
          - --no-fund
      args:
        chdir: "{{ travelmemory_app_root }}/frontend"
      become_user: ec2-user
      when: travelmemory_frontend_needs_build | bool

    - name: Build the React frontend with the deployed API endpoint
      ansible.builtin.command:
        argv:
          - npm
          - run
          - build
      args:
        chdir: "{{ travelmemory_app_root }}/frontend"
      environment:
        CI: "true"
        REACT_APP_BACKEND_URL: "http://{{ travelmemory_public_dns }}:{{ travelmemory_api_port }}"
        NODE_OPTIONS: --max-old-space-size=768
      become_user: ec2-user
      when: travelmemory_frontend_needs_build | bool
      notify: Reload nginx

    - name: Publish the built frontend to nginx
      ansible.builtin.copy:
        src: "{{ travelmemory_app_root }}/frontend/build/"
        dest: /usr/share/nginx/html/
        remote_src: true
        owner: root
        group: root
        mode: preserve
      when: travelmemory_frontend_needs_build | bool
      notify: Reload nginx

    - name: Record the API endpoint used for the frontend build
      ansible.builtin.copy:
        content: "http://{{ travelmemory_public_dns }}:{{ travelmemory_api_port }}\n"
        dest: /var/lib/travelmemory/frontend-api-url
        owner: root
        group: root
        mode: "0644"
      when: travelmemory_frontend_needs_build | bool

    - name: Configure the backend environment
      ansible.builtin.template:
        src: ../templates/backend.env.j2
        dest: /etc/travelmemory/backend.env
        owner: root
        group: ec2-user
        mode: "0640"
      no_log: true
      notify: Restart TravelMemory API

    - name: Install the TravelMemory API systemd unit
      ansible.builtin.template:
        src: ../templates/travelmemory-api.service.j2
        dest: /etc/systemd/system/{{ travelmemory_service_name }}.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart TravelMemory API

    - name: Install the nginx single-page application configuration
      ansible.builtin.template:
        src: ../templates/travelmemory.nginx.conf.j2
        dest: /etc/nginx/conf.d/travelmemory.conf
        owner: root
        group: root
        mode: "0644"
      notify: Reload nginx

    - name: Validate nginx configuration
      ansible.builtin.command:
        argv:
          - nginx
          - -t
      changed_when: false

    - name: Start and enable the application API
      ansible.builtin.systemd_service:
        name: "{{ travelmemory_service_name }}"
        enabled: true
        state: started
        daemon_reload: true

    - name: Start and enable nginx
      ansible.builtin.systemd_service:
        name: nginx
        enabled: true
        state: started

    - name: Apply application service and nginx changes
      ansible.builtin.meta: flush_handlers

    - name: Wait for the API to become healthy with its database
      ansible.builtin.uri:
        url: http://127.0.0.1:{{ travelmemory_api_port }}/health
        status_code: 200
        return_content: true
      register: travelmemory_api_health
      retries: 18
      delay: 5
      until: travelmemory_api_health.status == 200

    - name: Verify nginx serves the TravelMemory frontend
      ansible.builtin.uri:
        url: http://127.0.0.1/
        status_code: 200
        return_content: true
      register: travelmemory_frontend_health
      retries: 6
      delay: 3
      until: travelmemory_frontend_health.status == 200

  handlers:
    - name: Restart TravelMemory API
      ansible.builtin.systemd_service:
        name: "{{ travelmemory_service_name }}"
        state: restarted
        daemon_reload: true

    - name: Reload nginx
      ansible.builtin.systemd_service:
        name: nginx
        state: reloaded
