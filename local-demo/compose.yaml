name: travelmemory-local

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ${TRAVELMEMORY_SOURCE:-/tmp/TravelMemory}/backend
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/travelmemory
      PORT: "3001"
      CORS_ORIGIN: http://localhost:8080
      UPLOAD_DIR: uploads
      MAX_UPLOAD_MB: "5"
      TRUST_PROXY: "0"
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ${TRAVELMEMORY_SOURCE:-/tmp/TravelMemory}/frontend
      args:
        REACT_APP_BACKEND_URL: http://localhost:3001
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

volumes:
  mongodb-data:
  uploads-data:
